<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e88b2e">
  <title>Instalar Pixel Barber no iPhone</title>
  <style>
    :root { color-scheme: dark; font: 1rem/1.55 system-ui, sans-serif; background: #12141a; color: #f8f0e7; }
    body { padding: max(1rem, env(safe-area-inset-top)) 1rem max(1rem, env(safe-area-inset-bottom)); }
    main { max-width: 30rem; margin-inline: auto; padding: 1rem; border: 2px solid #aa6029; background: #211a25; }
    h1 { font: 700 1.5rem ui-monospace, monospace; }
    li { margin-block: .45rem; }
    a { display: inline-block; padding: .6rem .8rem; background: #e88b2e; color: #12141a; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <h1>Pixel Barber no iPhone</h1>
    <p>Instale a versão web na Tela de Início pelo Safari.</p>
    <ol>
      <li>Abra o Pixel Barber no Safari.</li>
      <li>Toque em <strong>Compartilhar → Adicionar à Tela de Início</strong>.</li>
      <li>Confirme em <strong>Adicionar</strong> e abra pelo novo ícone.</li>
    </ol>
    <a href="/">Abrir Pixel Barber</a>
  </main>
</body>
</html>
