name: Build iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator:
    runs-on: macos-15
    env:
      NEXT_PUBLIC_BACKEND_ORIGIN: ${{ vars.NEXT_PUBLIC_BACKEND_ORIGIN }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:ios
      - name: Compilar para o simulador
        run: >
          xcodebuild
          -project ios/App/App.xcodeproj
          -scheme App
          -configuration Release
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath ios/DerivedData
          CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Empacotar aplicativo
        run: ditto -c -k --keepParent ios/DerivedData/Build/Products/Release-iphonesimulator/App.app Pixel-Barber-iOS-Simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: pixel-barber-ios-simulator
          path: Pixel-Barber-iOS-Simulator.zip
          if-no-files-found: error
